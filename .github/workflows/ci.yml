name: Foundation checks

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_call:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Artifacts are only built and uploaded after the security gate passes.
    needs: security
    if: github.event_name != 'schedule'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Lockfiles must be current
        run: uv lock --check
      - run: uv sync --locked
      # npm ci fails when package-lock.json disagrees with package.json.
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm run lint --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      - run: uv build
      - name: Verify fresh Python installs and upgrade from v0.2.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_WHEEL: dist/upgrade-baseline/hcs_trader-0.2.0-py3-none-any.whl
          BASELINE_SHA256: d6b542608970900f0e39db47b7a53d8fb143b16bc2f9d3b80b9e112f3886cbef
        run: |
          gh release download v0.2.0 --repo timfromhcs/hcs-trading-intelligence \
            --pattern "${BASELINE_WHEEL##*/}" --dir dist/upgrade-baseline
          uv run --locked python -c 'import hashlib, sys; f = open(sys.argv[1], "rb"); sys.exit(hashlib.file_digest(f, "sha256").hexdigest() != sys.argv[2])' "$BASELINE_WHEEL" "$BASELINE_SHA256"
          uv run --locked python scripts/smoke_wheel.py --upgrade-from "$BASELINE_WHEEL"
      - name: Fail on strong-copyleft licenses
        run: uv run --locked python scripts/license_inventory.py --check > license-inventory.json
      - run: uv run --locked python scripts/generate_sbom.py --output sbom-${{ matrix.os }}.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licenses-${{ matrix.os }}
          path: |
            license-inventory.json
            sbom-${{ matrix.os }}.cdx.json
      - run: uv run --locked --group packaging python scripts/build_desktop.py
      - run: uv run --locked python scripts/smoke_desktop.py
      - run: uv run --locked python scripts/archive_desktop.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/desktop/*.tar.gz
            dist/desktop/*.tar.gz.sha256
          if-no-files-found: error
      - name: Build and verify the Windows single-file executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run --locked --group packaging python scripts/build_desktop.py --onefile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked python scripts/smoke_desktop.py --onefile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked python scripts/archive_desktop.py --onefile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: desktop-windows-single
          path: |
            dist/desktop-single/*.exe
            dist/desktop-single/*.exe.sha256
          if-no-files-found: error

  python313:
    # The wheel is pure Python (ADR 0010), so cibuildwheel is not needed; this
    # job checks the next interpreter instead.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - run: uv sync --locked --python 3.13
      - run: uv run --locked --python 3.13 pytest --no-cov -q

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - run: mkdir -p security-reports
      # defaults.run.shell is bash, which GitHub runs with -eo pipefail, so a
      # finding from uv audit / npm audit fails the step despite the tee.
      - run: uv audit --locked 2>&1 | tee security-reports/uv-audit.txt
      - run: uv audit --locked --only-group packaging 2>&1 | tee security-reports/uv-audit-packaging.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm audit --prefix frontend 2>&1 | tee security-reports/npm-audit.txt
      - name: Scan Git history for secrets
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks.tar.gz | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --report-format json --report-path "$GITHUB_WORKSPACE/security-reports/gitleaks.json" "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-reports-${{ github.sha }}
          path: security-reports/
          if-no-files-found: warn
