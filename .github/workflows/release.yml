name: Release

# Tag-triggered. Every gate in ci.yml re-runs on the exact tagged commit and the
# release is only ever created as a DRAFT after all gates, builds and checksum
# verification succeed. Nothing is uploaded to any package index from here.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    # Re-run the full PR pipeline (lint, types, tests, scans, native builds).
    uses: ./.github/workflows/ci.yml

  sast:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  preflight:
    needs: [gates, sast]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must match the project version and be reachable from main
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match pyproject version $version" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  assemble:
    # Builds the Python distributions and the SBOM; desktop archives come from the
    # gates run (native runners) and are collected in the publish job.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: uv sync --locked
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm run build --prefix frontend
      - run: uv build
      - run: uv run --locked python scripts/generate_sbom.py --output dist/sbom.cdx.json
      - run: uv run --locked python scripts/smoke_wheel.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
          if-no-files-found: error

  publish-draft:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the draft release (this job only)
      actions: read # download artifacts from this workflow run
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect artifacts from this run
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir collected
          python3 scripts/collect_release.py collected staging "$GITHUB_SHA"
          ls -l staging
      - name: Fill the MCP registry server.json from the built bundles
        run: |
          mkdir bundles
          cp staging/*.mcpb bundles/
          python3 scripts/build_mcpb.py registry --bundles bundles --output staging/server.json
      - name: Aggregate checksums and verify distribution contents
        run: python3 scripts/verify_release.py staging --write
      - name: Attest the verified release artifacts
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: staging/SHA256SUMS
      - name: Include the Sigstore bundle and refresh checksums
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$BUNDLE_PATH" staging/build-provenance.sigstore.json
          python3 scripts/verify_release.py staging --write
      - name: Build release notes from the changelog
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Draft release $TAG. Review before publishing."
            echo
            echo "SHA256SUMS covers every attached file. Verify downloads with sha256sum --check SHA256SUMS."
            echo "The Sigstore bundle attests the built artifacts. See docs/RELEASE.md for verification."
            echo
            awk '/^## /{n++} n==1' CHANGELOG.md
            echo
            echo "### Known limitations"
            echo "See docs/V1_RELEASE_REPORT.md and the capability matrix in README.md. Builds are unsigned development builds unless stated otherwise. Live trading is off by default."
          } > release-notes.md
      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --draft --verify-tag $prerelease \
            --title "HCS Trading Intelligence $TAG" \
            --notes-file release-notes.md \
            staging/*
