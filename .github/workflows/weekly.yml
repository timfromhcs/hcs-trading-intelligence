name: Weekly

# Deepest tier: mutation testing of the deterministic risk and signing-policy code,
# the chaos suite, dependency audits and a (placeholder) feed canary.
# No secrets, no real funds, no mainnet endpoints.

on:
  schedule:
    - cron: '47 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    # Report-only until a baseline mutation score is recorded (docs/WAVES.md appendix):
    # surviving mutants are uploaded and summarised, but do not fail the run yet.
    timeout-minutes: 240
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: uv sync --locked
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm run build --prefix frontend
      # Scope and runner are configured under [tool.mutmut] in pyproject.toml:
      # risk.py, signing.py and domain/signing.py.
      - name: mutmut
        continue-on-error: true
        run: uv run --locked --with mutmut==3.8.1 mutmut run
      - name: Summarise mutants
        if: always()
        run: |
          {
            echo '## Mutation results'
            echo '```'
            uv run --locked --with mutmut==3.8.1 mutmut results || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Flag a mutation run that produced nothing
        if: always()
        run: |
          if [ -z "$(ls -A mutants 2>/dev/null)" ]; then
            echo '::warning::mutmut produced no mutants/ output; the report-only job is not measuring anything'
            echo '**WARNING: mutmut produced no output.**' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutmut-results
          path: mutants/
          if-no-files-found: warn

  chaos:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HYPOTHESIS_PROFILE: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - run: uv sync --locked
      - name: Chaos and crash-recovery tests
        run: uv run --locked pytest tests/chaos tests/test_crash_recovery.py tests/test_exec_wiring.py -p no:cacheprovider --no-cov

  audit:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: mkdir -p security-reports
      - run: uv audit --locked 2>&1 | tee security-reports/uv-audit.txt
      - name: pip-audit the exported runtime requirements
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement requirements-audit.txt --no-deps --disable-pip --strict 2>&1 | tee security-reports/pip-audit.txt
      - run: npm audit --prefix frontend 2>&1 | tee security-reports/npm-audit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: weekly-audit-${{ github.sha }}
          path: security-reports/
          if-no-files-found: warn

  feed-canary:
    # Placeholder. Wave 2 adds the real canary that flips stale or failing sources to
    # DEGRADED. Until then this job intentionally does nothing and touches no network.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - run: echo "feed canary not implemented until Wave 2; no-op"

  report-failure:
    needs: [mutation, chaos, audit, feed-canary]
    if: ${{ always() && (needs.chaos.result == 'failure' || needs.audit.result == 'failure' || needs.feed-canary.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the weekly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          TITLE: Weekly CI failed
        run: |
          body="Weekly run failed on ${SHA}: ${RUN_URL}"
          number=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi
