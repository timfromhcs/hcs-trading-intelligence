[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[project]
name = "hcs-trader"
version = "0.2.0"
description = "Local-first foundation for HCS Trading Intelligence"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "HCS.media" }]
dependencies = [
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "eth-abi==6.0.0",
    "eth-account==0.14.0",
    "fastapi>=0.163.1",
    "httpx2>=2.16.0",
    "mcp>=2.3,<3",
    "platformdirs>=4.14.5",
    "rlp==5.0.0",
    "solders==0.29.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
hcs-trader = "hcs_trader.__main__:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "jsonschema",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-defusedxml>=0.7.0.20260504",
    "uv_build==0.13.5",
]
packaging = [
    "pyinstaller==6.22.3",
]

[tool.uv]
required-version = "==0.13.5"

[tool.uv.build-backend]
source-include = ["tests/**", "SECURITY.md", "CHANGELOG.md"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["AGENTS.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hcs_trader --cov-fail-under=80"
markers = [
    "allow_network: opt out of the default block on non-loopback sockets (tests/conftest.py)",
    "rehearsal: live testnet rehearsal; needs testnet API keys in env, skipped otherwise, never run in CI",
    "regtest: needs a real regtest node binary via HCS_BITCOIND/HCS_LITECOIND/HCS_DIGIBYTED",
]

[tool.mutmut]
# Weekly workflow only (.github/workflows/weekly.yml); not part of the PR gates.
paths_to_mutate = [
    "src/hcs_trader/risk.py",
    "src/hcs_trader/signing.py",
    "src/hcs_trader/domain/signing.py",
]
tests_dir = ["tests/"]
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]
