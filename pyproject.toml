[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[project]
name = "hcs-trader"
version = "0.1.0"
description = "Local-first foundation for HCS Trading Intelligence"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "HCS.media" }]
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.163.1",
    "httpx2>=2.16.0",
    "mcp>=2.3,<3",
    "platformdirs>=4.14.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
hcs-trader = "hcs_trader.__main__:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-defusedxml>=0.7.0.20260504",
    "uv_build==0.13.5",
]

[tool.uv]
required-version = "==0.13.5"

[tool.uv.build-backend]
source-include = ["tests/**", "SECURITY.md", "CHANGELOG.md"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["AGENTS.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hcs_trader --cov-fail-under=80"
